# Project
group=com.mrcrayfish

# Java
java_version=25

# Common
minecraft_version=26.3
neo_form_version=26.3-1

# Fabric
fabric_version=0.163.0+26.3
fabric_loader_version=0.19.5

# NeoForge
neoforge_version=26.3.0.77
neoforge_version_range=[26.3,)
neoforge_loader_version_range=[2,)

# Mod options
# Upstream version plus a port counter as build metadata, so it still counts as 1.2.1 to anything that checks
mod_version=1.2.1+port.1
mod_name=Mighty Mail: Unofficial Port
mod_author=MrCrayfish
mod_contributors=gabmaybelle (26.3 port)
mod_id=mighty_mail
mod_desc=A fun and simple mailing system for your world! Unofficial port of MrCrayfish's Mighty Mail to Minecraft 26.3.
mod_homepage=https://github.com/gabmaybelle/mighty-mail
mod_source=https://github.com/gabmaybelle/mighty-mail
mod_issues=https://github.com/gabmaybelle/mighty-mail/issues
mod_upstream=https://github.com/MrCrayfish/MightyMail
mod_license=MIT

# Dependency options
framework_version=0.13.27
# PORT-26.3: Refurbished Furniture has no 26.3 build yet (newest is 1.0.25 for 26.2). The migrate
# command compiles against the 26.2 jar for now; revisit when a 26.3 build is published.
refurbished_furniture=1.0.25
refurbished_furniture_minecraft_version=26.2

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.configuration-cache=false