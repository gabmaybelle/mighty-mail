# Builds the NeoForge jar on every push and pull request (this 26.1.2 branch is NeoForge only), then
# runs the in-game test (neoforge/src/clienttest) on a virtual display, so a broken build or a crash
# in game shows up straight away. Framework comes from MrCrayfish's GitHub Packages Maven, which
# needs a GitHub token with read:packages: add it as the repository secret GPR_TOKEN (any GitHub
# user's token works; the Maven is public but GitHub still asks for a token). The jar is attached to
# each run under "Artifacts", and the game test's screenshots alongside it.

name: build
on: [pull_request, push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # A pull request from a branch in this repo is already built by its push; only build forks' twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
      - name: install EGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libegl-mesa0
      # The block states, models, loot tables, recipes and tags are generated, not committed, so
      # they must be made here first or the jar and the game test have none of them. Gradle
      # refuses datagen and build in one invocation, hence two steps.
      - name: generate data
        env:
          GPR_USER: ${{ github.repository_owner }}
          GPR_KEY: ${{ secrets.GPR_TOKEN }}
          SDL_VIDEO_FORCE_EGL: '1'
        run: xvfb-run -a ./gradlew :neoforge:runData
      - name: build
        env:
          GPR_USER: ${{ github.repository_owner }}
          GPR_KEY: ${{ secrets.GPR_TOKEN }}
        run: ./gradlew :neoforge:build
      - name: run NeoForge game test
        # A failed check crashes the game, which fails this step; the crash report is uploaded below.
        # Mesa's EGL gives the sRGB-capable window the game asks for; SDL uses it with this set.
        env:
          GPR_USER: ${{ github.repository_owner }}
          GPR_KEY: ${{ secrets.GPR_TOKEN }}
          SDL_VIDEO_FORCE_EGL: '1'
        timeout-minutes: 15
        run: xvfb-run -a ./gradlew :neoforge:runClientTest
      - name: capture game test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Game test screenshots
          path: |
            neoforge/build/run/clientTest/screenshots/
            neoforge/build/run/clientTest/crash-reports/
          if-no-files-found: ignore
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            neoforge/build/libs/*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
