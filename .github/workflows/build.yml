# Builds the Fabric and NeoForge jars on every push and pull request, so a broken build shows up
# straight away. Framework comes from MrCrayfish's GitHub Packages Maven, which needs a GitHub
# token with read:packages: add it as the repository secret GPR_TOKEN (any GitHub user's token
# works; the Maven is public but GitHub still asks for a token). Both jars are attached to each
# run under "Artifacts".

name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # A pull request from a branch in this repo is already built by its push; only build forks' twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
      - name: build both loaders
        env:
          GPR_USER: ${{ github.repository_owner }}
          GPR_KEY: ${{ secrets.GPR_TOKEN }}
        run: ./gradlew :fabric:build :neoforge:build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
