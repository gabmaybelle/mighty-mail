import org.apache.commons.io.FilenameUtils

plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    enable {
        version = neoforge_version
        disableRecompilation = System.getenv("CI") == "true"
    }

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            clientData()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = "gameTestServer"
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// A jar without the generated block states, models, loot tables and recipes is useless, and it is
// easy to build one (the generated folder is not in git). Refuse, and say what to run.
tasks.named('jar') {
    doFirst {
        if (!file('src/generated/resources/assets').isDirectory() || !file('src/generated/resources/data').isDirectory()) {
            throw new GradleException("src/generated/resources is missing: run './gradlew :fabric:runDatagen :neoforge:runData' first, then build.")
        }
    }
}

dependencies {
    implementation "com.mrcrayfish:framework-neoforge:${framework_version}+${minecraft_version}"
    // PORT-26.3: Refurbished Furniture has no 26.3 build yet; compile against the 26.2 jar
    compileOnly("com.mrcrayfish:refurbished_furniture-neoforge:${refurbished_furniture}+${refurbished_furniture_minecraft_version}") {
        // PORT-26.3: the 26.2 package declares its own capability names, so Gradle needs this hint to pick a variant
        capabilities { requireCapability("com.mrcrayfish:refurbished_furniture") }
    }
}

tasks.register("signJar") {
    dependsOn jar
    onlyIf {
        findProperty('keyStore') || System.getenv("KEYSTORE")
    }
    doLast {
        def unsignedJar = tasks.jar.archiveFile.get().asFile
        def name = FilenameUtils.removeExtension(unsignedJar.getName())
        def signedJar  = layout.buildDirectory.file("libs/%s-signed.jar".formatted(name)).get().asFile
        def signingKeyAlias = findProperty('keyStoreAlias') ?: System.getenv("KEYSTORE_ALIAS")
        def signingKeystore = findProperty('keyStore') ?: System.getenv("KEYSTORE")
        def signingPassword = findProperty('keyStorePass') ?: System.getenv("KEYSTORE_PASS")
        ant.signjar(
            jar: unsignedJar,
            signedJar: signedJar,
            alias: signingKeyAlias,
            keyStore: signingKeystore,
            storePass: signingPassword,
            storetype: 'jks'
        )
        println "Signed jar created at: $signedJar"
    }
}

jar.finalizedBy 'signJar'
