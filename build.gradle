buildscript {
    dependencies {
        // FilenameUtils is used by the signJar tasks; Gradle 9 no longer ships commons-io on the build classpath
        classpath 'commons-io:commons-io:2.20.0'
    }
}

plugins {
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.7"
    id 'net.fabricmc.fabric-loom' version '1.18.4' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}
