plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    enable {
        // Look for versions on https://projects.neoforged.net/neoforged/neoform
        neoFormVersion = neo_form_version
        disableRecompilation = System.getenv("CI") == "true"
    }

    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.add(at.absolutePath)
    }
}

dependencies {
    compileOnly "com.mrcrayfish:framework-common:${framework_version}+${minecraft_version}"
    compileOnly("com.mrcrayfish:refurbished_furniture-common:${refurbished_furniture}+${refurbished_furniture_minecraft_version}") {
        // PORT-26.3: the 26.2 package declares its own capability names, so Gradle needs this hint to pick a variant
        capabilities { requireCapability("com.mrcrayfish:refurbished_furniture") }
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}