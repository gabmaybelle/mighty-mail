import org.apache.commons.io.FilenameUtils

plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "com.mrcrayfish:framework-fabric:${framework_version}+${minecraft_version}"
    // PORT-26.3: compile-only because the 26.2 Refurbished Furniture jar cannot run on 26.3
    compileOnly("com.mrcrayfish:refurbished_furniture-fabric:${refurbished_furniture}+${refurbished_furniture_minecraft_version}") {
        // PORT-26.3: the 26.2 package declares its own capability names, so Gradle needs this hint to pick a variant
        capabilities { requireCapability("com.mrcrayfish:refurbished_furniture") }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    // Compatibility run: `./gradlew :fabric:runClientGameTest -PtestBop` plays the in-game test with
    // Biomes O' Plenty installed (fetched from Modrinth's maven by version id), so the test's wood-mod
    // section runs: the compat mailboxes exist, craft, drop, render, and take mail. Nothing here is
    // bundled or required.
    if (project.hasProperty("testBop")) {
        runtimeOnly "maven.modrinth:biomes-o-plenty:${test_bop_version}"
        runtimeOnly "maven.modrinth:terrablender:${test_terrablender_version}"
        runtimeOnly "maven.modrinth:glitchcore:${test_glitchcore_version}"
    }
}

fabricApi {
    configureDataGeneration {
        client = true
        outputDirectory.set(file("src/generated/resources"))
        modId = "${mod_id}"
    }
    // The in-game test: `./gradlew :fabric:runClientGameTest` starts a real game and plays through
    // src/gametest (place a mailbox, name it, send a package, deliver, open, break). Nothing there
    // ships in the jar. CI runs it on every push.
    configureTests {
        createSourceSet = true
        modId = "${mod_id}_gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

loom {
    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            name("Fabric: Client")
            ideConfigGenerated(true)
        }
        server {
            name("Fabric: Server")
            ideConfigGenerated(true)
        }
        datagen {
            name("Fabric: Data")
            ideConfigGenerated(true)
        }
    }
}

tasks.register("signJar") {
    dependsOn jar
    onlyIf {
        findProperty('keyStore') || System.getenv("KEYSTORE")
    }
    doLast {
        def unsignedJar = jar.archiveFile.get().asFile
        def name = FilenameUtils.removeExtension(unsignedJar.getName())
        def signedJar  = layout.buildDirectory.file("libs/%s-signed.jar".formatted(name)).get().asFile
        def signingKeyAlias = findProperty('keyStoreAlias') ?: System.getenv("KEYSTORE_ALIAS")
        def signingKeystore = findProperty('keyStore') ?: System.getenv("KEYSTORE")
        def signingPassword = findProperty('keyStorePass') ?: System.getenv("KEYSTORE_PASS")
        ant.signjar(
            jar: unsignedJar,
            signedJar: signedJar,
            alias: signingKeyAlias,
            keyStore: signingKeystore,
            storePass: signingPassword,
            storetype: 'jks'
        )
        println "Signed jar created at: $signedJar"
    }
}

build.dependsOn signJar